<!doctype html>
<html><head><meta charset="utf-8"><title>Crossfade DJ — иконка</title>
<style>html, body { margin: 0; width: 512px; height: 512px; background: transparent; overflow: hidden; }</style>
</head><body>
<svg id="art" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
// Две волны: уходящий трек (жёлтая) затихает, входящий (фиолетовая) нарастает; внизу — кроссфейдер
const svg = document.getElementById('art');
const N = 17, x0 = 92, x1 = 420, mid = 236, bw = 12;
let bars = '';
for (let i = 0; i < N; i++) {
    const k = i / (N - 1), x = x0 + (x1 - x0) * k;
    const wob = 0.62 + 0.38 * Math.abs(Math.sin(i * 1.9 + 0.4));
    const hOut = 150 * Math.cos(k * Math.PI / 2) * wob + 6;
    const hIn = 150 * Math.sin(k * Math.PI / 2) * (0.62 + 0.38 * Math.abs(Math.cos(i * 1.7))) + 6;
    bars += `<rect x="${x - bw / 2 - 5}" y="${mid - hOut}" width="${bw}" height="${hOut * 2}" rx="6" fill="url(#gOut)"/>`;
    bars += `<rect x="${x - bw / 2 + 5}" y="${mid - hIn}" width="${bw}" height="${hIn * 2}" rx="6" fill="url(#gIn)" opacity="0.92"/>`;
}
svg.innerHTML = `
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#241b3d"/><stop offset="1" stop-color="#0c0b12"/></linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.46" r="0.5"><stop offset="0" stop-color="#ffcc00" stop-opacity="0.18"/><stop offset="1" stop-color="#ffcc00" stop-opacity="0"/></radialGradient>
  <linearGradient id="gOut" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
  <linearGradient id="gIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9a8ff"/><stop offset="1" stop-color="#7b5cff"/></linearGradient>
</defs>
<rect width="512" height="512" rx="112" fill="url(#bg)"/>
<rect width="512" height="512" rx="112" fill="url(#glow)"/>
${bars}
<rect x="96" y="420" width="320" height="14" rx="7" fill="#ffffff" opacity="0.14"/>
<rect x="96" y="420" width="160" height="14" rx="7" fill="#ffcc00" opacity="0.55"/>
<rect x="232" y="398" width="48" height="58" rx="12" fill="#f4f4f8"/>
<rect x="253" y="408" width="6" height="38" rx="3" fill="#0c0b12" opacity="0.55"/>`;
</script>
</body></html>
