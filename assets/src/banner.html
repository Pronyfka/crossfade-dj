<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Crossfade DJ — баннер</title>
<style>
    html, body { margin: 0; width: 2150px; height: 550px; overflow: hidden; }
    body {
        font-family: "Segoe UI", system-ui, sans-serif; color: #f2f2f5; position: relative;
        background: radial-gradient(900px 500px at 75% 50%, #2c2150 0%, transparent 70%),
                    radial-gradient(700px 420px at 15% 100%, #3a2a0e 0%, transparent 70%), #0c0b12;
    }
    #wave { position: absolute; left: 0; top: 0; }
    .text { position: absolute; left: 180px; top: 150px; }
    h1 { margin: 0; font-size: 132px; font-weight: 800; letter-spacing: -3px; line-height: 1; }
    h1 span { color: #ffcc00; }
    p { margin: 26px 0 0; font-size: 40px; color: #c9c9d4; }
</style>
</head><body>
<svg id="wave" width="2150" height="550" viewBox="0 0 2150 550" xmlns="http://www.w3.org/2000/svg"></svg>
<div class="text">
    <h1>Crossfade <span>DJ</span></h1>
    <p>Диджейские переходы для Яндекс Музыки</p>
</div>
<script>
// Волны двух треков через весь баннер: жёлтая уходит, фиолетовая заходит (справа — подальше от текста)
const svg = document.getElementById('wave');
const x0 = 1080, x1 = 2040, N = 44, mid = 275, bw = 10;
let s = `<defs>
  <linearGradient id="gOut" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
  <linearGradient id="gIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9a8ff"/><stop offset="1" stop-color="#7b5cff"/></linearGradient>
</defs>`;
for (let i = 0; i < N; i++) {
    const k = i / (N - 1), x = x0 + (x1 - x0) * k;
    const hOut = 175 * Math.cos(k * Math.PI / 2) * (0.55 + 0.45 * Math.abs(Math.sin(i * 1.3 + 0.4))) + 5;
    const hIn = 175 * Math.sin(k * Math.PI / 2) * (0.55 + 0.45 * Math.abs(Math.cos(i * 1.1))) + 5;
    s += `<rect x="${x - 9}" y="${mid - hOut}" width="${bw}" height="${hOut * 2}" rx="5" fill="url(#gOut)"/>`;
    s += `<rect x="${x + 1}" y="${mid - hIn}" width="${bw}" height="${hIn * 2}" rx="5" fill="url(#gIn)" opacity="0.92"/>`;
}
svg.innerHTML = s;
</script>
</body></html>
